name: monorepo-ci

# Runs on every pull request and every push to main, with no path filter: the whole TypeScript
# monorepo must format, typecheck, lint, test and build together. Per-workspace workflows add
# focused checks (and the contracts workflow covers Rust).

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Format
        run: bunx prettier --check . --ignore-path .prettierignore
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
